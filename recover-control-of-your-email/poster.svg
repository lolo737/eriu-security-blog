<rect x="150" y="690" width="210" height="150" rx="15" fill="#102b31" stroke="#00dbcc" stroke-width="3"/><rect x="175" y="715" width="160" height="82" rx="7" fill="#041216" stroke="#aec3c7" stroke-opacity=".5"/><circle cx="310" cy="815" r="7" fill="#00dbcc"/><text x="255" y="890" fill="#aec3c7" font-size="23" text-anchor="middle">THINKCENTRE</text>
<path d="M390 765H475" stroke="#ffb81a" stroke-width="5"/><path d="M460 748L480 765L460 782" fill="none" stroke="#ffb81a" stroke-width="5"/>
<rect x="500" y="690" width="240" height="150" rx="15" fill="#102b31" stroke="#00dbcc" stroke-width="3"/><text x="620" y="755" fill="#eafcfd" font-size="30" text-anchor="middle" font-weight="bold">POSTFIX</text><text x="620" y="800" fill="#aec3c7" font-size="20" text-anchor="middle">Mail transfer</text>
<path d="M770 765H850" stroke="#ffb81a" stroke-width="5"/><path d="M835 748L855 765L835 782" fill="none" stroke="#ffb81a" stroke-width="5"/>
<rect x="875" y="690" width="175" height="150" rx="15" fill="#102b31" stroke="#00dbcc" stroke-width="3"/><text x="962" y="755" fill="#eafcfd" font-size="30" text-anchor="middle" font-weight="bold">IMAP</text><text x="962" y="800" fill="#aec3c7" font-size="20" text-anchor="middle">Mailboxes</text>
<text x="90" y="1030" fill="#00dbcc" font-size="29" font-weight="bold" letter-spacing="3">THE REALITY CHECK</text>
<text x="90" y="1090" fill="#eafcfd" font-size="35">01  Diagnose before blaming the provider.</text><text x="90" y="1155" fill="#eafcfd" font-size="35">02  Understand DNS, mail flow and identity.</text><text x="90" y="1220" fill="#eafcfd" font-size="35">03  Test IMAP, TLS, SPF, DKIM and DMARC.</text><text x="90" y="1285" fill="#eafcfd" font-size="35">04  Back up. Restore. Monitor. Repeat.</text>
<rect x="90" y="1350" width="1020" height="2" fill="#00dbcc" opacity=".4"/><text x="90" y="1410" fill="#ffb81a" font-size="25" letter-spacing="3">THE SOFTWARE MAY BE FREE. THE RESPONSIBILITY ISN'T.</text><text x="90" y="1460" fill="#7f969b" font-size="18" letter-spacing="3">AWARENESS &amp; DEFENCE ONLY · ERIU.TECH</text></g></svg>