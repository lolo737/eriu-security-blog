<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="t d">
<title id="t">Simplified mail server architecture</title>
<desc id="d">Mail clients, Postfix, internet mail servers and Dovecot sit at four points around a large oval. Crayon-like curved arrows with clear arrowheads run clockwise between them.</desc>
<rect width="1100" height="680" rx="18" fill="#061418"/>
<text x="550" y="52" font-family="Arial,sans-serif" font-size="25" fill="#00dbcc" letter-spacing="4" text-anchor="middle">A SMALL MAIL-SERVER LAB</text>

<!-- Circular layout: each service occupies one point of the oval. -->
<g font-family="Arial,sans-serif" text-anchor="middle">
  <rect x="50" y="230" width="210" height="150" rx="16" fill="#102b31" stroke="#00dbcc" stroke-width="3"/>
  <text x="155" y="285" font-size="27" fill="#eafcfd" font-weight="bold">MAIL CLIENTS</text>
  <text x="155" y="325" font-size="19" fill="#aec3c7">Desktop · Phone</text>

  <rect x="445" y="90" width="220" height="125" rx="16" fill="#102b31" stroke="#ffb81a" stroke-width="3"/>
  <text x="555" y="140" font-size="29" fill="#eafcfd" font-weight="bold">POSTFIX</text>
  <text x="555" y="177" font-size="19" fill="#aec3c7">SMTP transfer</text>

  <rect x="840" y="230" width="210" height="150" rx="16" fill="#102b31" stroke="#40ea99" stroke-width="3"/>
  <text x="945" y="285" font-size="27" fill="#eafcfd" font-weight="bold">INTERNET</text>
  <text x="945" y="325" font-size="19" fill="#aec3c7">Other mail servers</text>

  <rect x="445" y="425" width="220" height="125" rx="16" fill="#102b31" stroke="#00dbcc" stroke-width="3"/>
  <text x="555" y="475" font-size="29" fill="#eafcfd" font-weight="bold">DOVECOT</text>
  <text x="555" y="512" font-size="19" fill="#aec3c7">IMAP access</text>
</g>

<!-- Four separate sweeping arcs make one unmistakable oval route. -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Clients to Postfix -->
  <path d="M260 250 C302 145 365 116 445 150" stroke="#f33df2" stroke-width="13" opacity=".18"/>
  <path d="M260 250 C302 145 365 116 445 150" stroke="#f33df2" stroke-width="7"/>
  <path d="M263 253 C306 151 369 122 442 154" stroke="#ffd2ff" stroke-width="2" opacity=".65"/>

  <!-- Postfix to Internet -->
  <path d="M665 150 C745 116 808 145 840 250" stroke="#f33df2" stroke-width="13" opacity=".18"/>
  <path d="M665 150 C745 116 808 145 840 250" stroke="#f33df2" stroke-width="7"/>
  <path d="M668 154 C748 122 810 151 836 253" stroke="#ffd2ff" stroke-width="2" opacity=".65"/>

  <!-- Internet to Dovecot -->
  <path d="M840 360 C808 465 745 494 665 470" stroke="#f33df2" stroke-width="13" opacity=".18"/>
  <path d="M840 360 C808 465 745 494 665 470" stroke="#f33df2" stroke-width="7"/>
  <path d="M836 363 C805 462 742 490 668 466" stroke="#ffd2ff" stroke-width="2" opacity=".65"/>

  <!-- Dovecot to Clients -->
  <path d="M445 470 C365 494 302 465 260 360" stroke="#f33df2" stroke-width="13" opacity=".18"/>
  <path d="M445 470 C365 494 302 465 260 360" stroke="#f33df2" stroke-width="7"/>
  <path d="M442 466 C369 490 306 462 263 357" stroke="#ffd2ff" stroke-width="2" opacity=".65"/>
</g>

<!-- Filled, slightly irregular arrowheads: the points sit at the receiving end of each arc. -->
<g stroke="#f33df2" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
  <path d="M445 150 L414 132 L422 166 Z" fill="#f33df2"/>
  <path d="M840 250 L812 228 L807 261 Z" fill="#f33df2"/>
  <path d="M665 470 L696 486 L689 452 Z" fill="#f33df2"/>
  <path d="M260 360 L287 382 L294 348 Z" fill="#f33df2"/>
</g>
<!-- Short wax-pencil flicks give the lines a hand-drawn edge. -->
<g fill="none" stroke="#ffd2ff" stroke-width="2.5" stroke-linecap="round" opacity=".65">
  <path d="M284 191 l-7 12 M305 161 l-3 9 M393 128 l8 4 M710 131 l8 -4 M812 184 l-1 9 M824 407 l7 5 M777 468 l-8 5 M697 482 l-5 -5 M284 408 l-7 -8"/>
</g>

<rect x="390" y="590" width="320" height="60" rx="10" fill="#0b2025" stroke="#426168"/>
<text x="550" y="628" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#aec3c7">Rspamd · TLS · DNS · Backups</text>
</svg>