<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" role="img" aria-labelledby="t d">
<title id="t">Small mail-server lab flow</title>
<desc id="d">Mail Clients on the west, Postfix to the north, Internet to the east and Dovecot to the south sit around a clockwise oval mail-flow line. Arrowheads point into each service box where the line passes behind it.</desc>
<defs>
  <filter id="crayon" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="8" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>
<rect width="1100" height="680" rx="18" fill="#061418"/>
<text x="550" y="52" font-family="Arial,sans-serif" font-size="25" fill="#00dbcc" letter-spacing="4" text-anchor="middle">A SMALL MAIL-SERVER LAB</text>

<!-- One continuous oval, drawn behind the four service boxes. -->
<path d="M245 310 C245 190 390 135 550 135 C710 135 855 190 855 310 C855 430 710 485 550 485 C390 485 245 430 245 310"
      fill="none" stroke="#f33df2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#crayon)"/>

<!-- Service boxes at the four compass points. -->
<g font-family="Arial,sans-serif" text-anchor="middle">
  <rect x="50" y="230" width="210" height="150" rx="16" fill="#102b31" stroke="#00dbcc" stroke-width="3"/>
  <text x="155" y="285" font-size="27" fill="#eafcfd" font-weight="bold">MAIL CLIENTS</text>
  <text x="155" y="325" font-size="19" fill="#aec3c7">Desktop · Phone</text>

  <rect x="445" y="90" width="220" height="125" rx="16" fill="#102b31" stroke="#ffb81a" stroke-width="3"/>
  <text x="555" y="140" font-size="29" fill="#eafcfd" font-weight="bold">POSTFIX</text>
  <text x="555" y="177" font-size="19" fill="#aec3c7">SMTP transfer</text>

  <rect x="840" y="230" width="210" height="150" rx="16" fill="#102b31" stroke="#40ea99" stroke-width="3"/>
  <text x="945" y="285" font-size="27" fill="#eafcfd" font-weight="bold">INTERNET</text>
  <text x="945" y="325" font-size="19" fill="#aec3c7">Other mail servers</text>

  <rect x="445" y="425" width="220" height="125" rx="16" fill="#102b31" stroke="#00dbcc" stroke-width="3"/>
  <text x="555" y="475" font-size="29" fill="#eafcfd" font-weight="bold">DOVECOT</text>
  <text x="555" y="512" font-size="19" fill="#aec3c7">IMAP access</text>
</g>

<!-- Direction markers sit at the points where the oval disappears behind each box. -->
<!-- Open chevrons centred precisely on the oval's centreline.
     Each tip sits on the path; the two arms are symmetric about its tangent,
     so the back of each chevron is perpendicular to the direction of travel. -->
<g fill="none" stroke="#f33df2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
  <path d="M418.7 168.6 L443.7 143.8 L411.7 129.2"/>
  <path d="M809.7 233 L840.7 249.6 L845.2 214.7"/>
  <path d="M690.7 449.1 L666.1 474.4 L698.4 488.4"/>
  <path d="M285.1 380.8 L255.3 362 L248.3 396.5"/>
</g>

<rect x="390" y="590" width="320" height="60" rx="10" fill="#0b2025" stroke="#426168"/>
<text x="550" y="628" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#aec3c7">Rspamd · TLS · DNS · Backups</text>
</svg>