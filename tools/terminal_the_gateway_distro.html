<h2>Eight scenes you'll see every week</h2>
<p>Each one is a real job from a normal week with an old laptop and a new SSD. They play as they scroll into view, and there's a replay under each. <span style="color:var(--mut);font-size:.85em">(Output simplified for the page.)</span></p>
<div class="gtgrid" id="gtgrid"></div>
<figure class="pit"><img src="wifi-postit.png" alt="A curled pink Post-it note held on with tape, reading wifi, with an old password crossed out and a new one written beneath"><figcaption>Exhibit A, from scene 3: the wifi password, as kept in the wild. The tape is doing all the work. (The password has since been changed. Obviously.)</figcaption></figure>
<figure class="sqf"><img src="side-quest-perspective.png" alt="A game-style side quest card, tilted into the distance with the text fading away, reading Finish distro-hopping, Wurzel will appreciate this"><figcaption>New side quest unlocked. <a href="side-quest-flat.png" target="_blank" rel="noopener noreferrer">Flat version here</a>, for dropping into anything.</figcaption></figure>
<style>
figure.sqf{margin:10px 0 34px}
figure.sqf img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:12px;box-shadow:0 0 50px rgba(0,219,204,.10)}
figure.sqf figcaption{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut);margin-top:10px;text-align:center;letter-spacing:.06em}
figure.pit{margin:6px auto 30px;max-width:340px;text-align:center}
figure.pit img{display:block;width:100%;height:auto}
figure.pit figcaption{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--mut);margin-top:6px;letter-spacing:.04em;line-height:1.5}
.gtgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0 28px}
.gtcard{min-width:0}
.gtcap{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--am);margin-bottom:8px}
.gtcap b{color:var(--cy);margin-right:8px}
.gtterm{border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 40px rgba(0,0,0,.45)}
.gtbar{display:flex;align-items:center;gap:6px;padding:8px 11px;background:#4a1b3b;font-family:'JetBrains Mono',monospace;font-size:11px;color:#dfe9ec}
.gtbar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28);display:inline-block}
.gtbar i:first-child{background:#e95420}
.gtbar span{margin-left:8px;letter-spacing:.04em}
.gtscr{margin:0;height:272px;overflow:hidden;padding:12px 13px;background:#2c0a22;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.55;white-space:pre;color:#e6edf0}
.gtscr .p{color:#8ae234}.gtscr .e{color:#ff7b7b}.gtscr .ok{color:#7be8b4}.gtscr .w{color:#ffd166}
.gtscr .cur{display:inline-block;width:.55em;height:1em;background:#e6edf0;vertical-align:-2px;animation:gtblink 1s steps(1) infinite}
@keyframes gtblink{50%{opacity:0}}
.gtrep{font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cy);background:transparent;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;margin-top:8px}
.gtrep:hover{border-color:rgba(0,219,204,.5)}
@media(max-width:720px){.gtgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.gtscr .cur{animation:none}}
</style>
<script>
(function(){
 var SCENES=[{"n": 1, "t": "Keep it patched", "d": [["c", "niall@ubuntu:~$ ", "sudo apt update"], ["o", "[sudo] password for niall:"], ["o", "Hit:1 ie.archive.ubuntu.com noble"], ["o", "Get:2 security.ubuntu.com noble-security"], ["o", "Fetched 1,204 kB in 2s"], ["o", "14 packages can be upgraded.", "ok"], ["c", "niall@ubuntu:~$ ", "sudo apt upgrade"], ["o", "The following will be upgraded:"], ["o", "  firefox libssl3t64 linux-image-generic"], ["o", "14 upgraded, 0 newly installed.", "ok"], ["o", "*** System restart required ***", "w"], ["c", "niall@ubuntu:~$ ", ""]]}, {"n": 2, "t": "Find your feet", "d": [["c", "niall@ubuntu:~$ ", "pwd"], ["o", "/home/niall", "ok"], ["c", "niall@ubuntu:~$ ", "ls"], ["o", "Desktop  Documents  Downloads  Music"], ["c", "niall@ubuntu:~$ ", "cd Documents"], ["c", "niall@ubuntu:~/Documents$ ", "mkdir invoices"], ["c", "niall@ubuntu:~/Documents$ ", "ls"], ["o", "invoices  letter.odt"], ["c", "niall@ubuntu:~/Documents$ ", "cp letter.odt invoices/"], ["o", "(no output means it worked)", "ok"], ["c", "niall@ubuntu:~/Documents$ ", "mv letter.odt old-letter.odt"], ["c", "niall@ubuntu:~/Documents$ ", ""]]}, {"n": 3, "t": "Look inside", "d": [["c", "niall@ubuntu:~$ ", "cat notes.txt"], ["o", "wifi password: on the fridge"], ["o", "buy milk"], ["o", "ring Mam"], ["c", "niall@ubuntu:~$ ", "grep -i wifi notes.txt"], ["o", "wifi password: on the fridge", "ok"], ["c", "niall@ubuntu:~$ ", "wc -l notes.txt"], ["o", "3 notes.txt"], ["c", "niall@ubuntu:~$ ", "find ~ -name \"*.pdf\""], ["o", "/home/niall/Documents/march.pdf", "ok"], ["o", "/home/niall/Downloads/manual.pdf", "ok"], ["c", "niall@ubuntu:~$ ", ""]]}, {"n": 4, "t": "Install and remove", "d": [["c", "niall@ubuntu:~$ ", "sudo apt install htop"], ["o", "The following NEW packages will be"], ["o", "installed:"], ["o", "  htop"], ["o", "0 upgraded, 1 newly installed.", "ok"], ["o", "Setting up htop ..."], ["c", "niall@ubuntu:~$ ", "sudo apt remove htop"], ["o", "Removing htop ...", "ok"], ["c", "niall@ubuntu:~$ ", "apt search vlc | head -3"], ["o", "vlc/noble  media player", "ok"], ["c", "niall@ubuntu:~$ ", ""]]}, {"n": 5, "t": "Is it healthy?", "d": [["c", "niall@ubuntu:~$ ", "df -h"], ["o", "Filesystem  Size Used Avail Use%"], ["o", "/dev/sda2    233G  41G  180G  19%", "ok"], ["c", "niall@ubuntu:~$ ", "free -h"], ["o", "       total   used   free"], ["o", "Mem:   7.7Gi  2.1Gi  3.9Gi", "ok"], ["o", "Swap:  2.0Gi     0B  2.0Gi"], ["c", "niall@ubuntu:~$ ", "uptime"], ["o", " up 3 days, load average: 0.21", "ok"], ["c", "niall@ubuntu:~$ ", ""]]}, {"n": 6, "t": "Lock the door", "d": [["c", "niall@ubuntu:~$ ", "sudo ufw status"], ["o", "Status: inactive", "e"], ["c", "niall@ubuntu:~$ ", "sudo ufw enable"], ["o", "Firewall is active and enabled", "ok"], ["o", "on system startup", "ok"], ["c", "niall@ubuntu:~$ ", "sudo ufw status"], ["o", "Status: active", "ok"], ["c", "niall@ubuntu:~$ ", ""]]}, {"n": 7, "t": "Who can see it?", "d": [["c", "niall@ubuntu:~$ ", "ls -l notes.txt"], ["o", "-rw-r--r-- 1 niall niall 52 notes.txt"], ["o", "(everyone on the machine can read it)", "w"], ["c", "niall@ubuntu:~$ ", "chmod 600 notes.txt"], ["c", "niall@ubuntu:~$ ", "ls -l notes.txt"], ["o", "-rw------- 1 niall niall 52 notes.txt", "ok"], ["o", "(now only you can)", "ok"], ["c", "niall@ubuntu:~$ ", ""]]}, {"n": 8, "t": "Ask the manual", "d": [["c", "niall@ubuntu:~$ ", "man ls"], ["o", "LS(1)           User Commands"], ["o", "NAME", "ok"], ["o", "       ls - list directory contents"], ["o", "(press q to leave)", "w"], ["c", "niall@ubuntu:~$ ", "ls --help | head -3"], ["o", "Usage: ls [OPTION]... [FILE]..."], ["o", "List information about the FILEs.", "ok"], ["c", "niall@ubuntu:~$ ", ""]]}];
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
 function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
 function line(l){return l[0]=='c'?'<span class="p">'+esc(l[1])+'</span>'+esc(l[2]):(l[2]?'<span class="'+l[2]+'">'+esc(l[1])+'</span>':esc(l[1]))}
 function full(el,seq){el.innerHTML=seq.map(line).join('\n')+'<span class="cur"></span>'}
 var grid=document.getElementById('gtgrid');
 SCENES.forEach(function(sc){
  var card=document.createElement('div');card.className='gtcard';
  card.innerHTML='<div class="gtcap"><b>'+sc.n+'</b>'+esc(sc.t)+'</div><div class="gtterm"><div class="gtbar"><i></i><i></i><i></i><span>niall@ubuntu: ~</span></div><pre class="gtscr"></pre></div><button class="gtrep" type="button">&#8635; Replay</button>';
  grid.appendChild(card);
  var el=card.querySelector('pre'),btn=card.querySelector('button'),run=0;
  async function play(){
   var id=++run,h='';el.innerHTML='<span class="cur"></span>';await sleep(350);
   for(var i=0;i<sc.d.length;i++){
    if(id!==run)return;var l=sc.d[i];
    if(l[0]=='c'){h+='<span class="p">'+esc(l[1])+'</span>';
     for(var j=0;j<l[2].length;j++){if(id!==run)return;h+=esc(l[2][j]);el.innerHTML=h+'<span class="cur"></span>';await sleep(55+Math.random()*50)}
     if(i<sc.d.length-1){h+='\n';el.innerHTML=h+'<span class="cur"></span>';await sleep(380)}}
    else{h+=line(l)+'\n';el.innerHTML=h+'<span class="cur"></span>';await sleep(220)}
   }
  }
  if(reduce){full(el,sc.d);btn.style.display='none';return}
  full(el,[sc.d[0]]);
  btn.addEventListener('click',play);
  if('IntersectionObserver' in window){var seen=false,io=new IntersectionObserver(function(en){if(en[0].isIntersecting&&!seen){seen=true;play();io.disconnect()}},{threshold:.4});io.observe(card)}else play();
 });
})();
</script>
