<h2>Side by side</h2>
<p>Same four jobs, two dialects. The red line is a hop that stays quiet, and the trace carries on regardless. <span style="color:var(--mut);font-size:.85em">(Output simplified for the page.)</span></p>
<div class="termwrap" id="termwrap">
 <div class="term ps"><div class="bar"><i></i><i></i><i></i><span>Windows PowerShell</span></div><pre class="scr" id="t-ps"></pre></div>
 <div class="term ub"><div class="bar"><i></i><i></i><i></i><span>niall@ubuntu: ~</span></div><pre class="scr" id="t-ub"></pre></div>
</div>
<button class="replay" id="t-replay" type="button">&#8635; Replay</button>
<style>
.termwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 10px}
.term{border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 40px rgba(0,0,0,.45)}
.term .bar{display:flex;align-items:center;gap:6px;padding:8px 11px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#dfe9ec}
.term .bar i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.28);display:inline-block}
.term .bar span{margin-left:8px;letter-spacing:.04em}
.term.ps .bar{background:#0b3a78}.term.ub .bar{background:#4a1b3b}.term.ub .bar i:first-child{background:#e95420}
.scr{margin:0;height:318px;overflow:hidden;padding:12px 13px;font-family:'JetBrains Mono',monospace;font-size:11.2px;line-height:1.55;white-space:pre;color:#e6edf0}
.term.ps .scr{background:#012456}.term.ub .scr{background:#2c0a22}
.scr .p{color:#ffe08a}.term.ub .scr .p{color:#8ae234}.scr .e{color:#ff7b7b}.scr .ok{color:#7be8b4}
.scr .cur{display:inline-block;width:.55em;height:1em;background:#e6edf0;vertical-align:-2px;animation:tblink 1s steps(1) infinite}
@keyframes tblink{50%{opacity:0}}
.replay{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--cy);background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 14px;cursor:pointer;margin-bottom:6px}
.replay:hover{border-color:rgba(0,219,204,.5)}
@media(max-width:720px){.termwrap{grid-template-columns:1fr}.scr{height:290px}}
@media (prefers-reduced-motion:reduce){.scr .cur{animation:none}}
</style>
<script>
(function(){
 var PS=[["c","PS C:\> ","tracert -d 8.8.8.8"],["o","  1   <1 ms   192.168.1.1","ok"],["o","  2    9 ms   10.20.0.1"],["o","  3     *      Request timed out.","e"],["o","  4   14 ms   203.0.113.9"],["o","  5   14 ms   8.8.8.8","ok"],["o","Trace complete."],["c","PS C:\> ","nslookup ubuntu.com"],["o","Name:    ubuntu.com"],["o","Address: 203.0.113.50","ok"],["c","PS C:\> ","ipconfig /flushdns"],["o","Successfully flushed the DNS cache.","ok"],["c","PS C:\> ",""]];
 var UB=[["c","niall@ubuntu:~$ ","traceroute -n 8.8.8.8"],["o"," 1  192.168.1.1  0.9 ms","ok"],["o"," 2  10.20.0.1  8.7 ms"],["o"," 3  * * *","e"],["o"," 4  203.0.113.9  13.9 ms"],["o"," 5  8.8.8.8  14.2 ms","ok"],["c","niall@ubuntu:~$ ","resolvectl query ubuntu.com"],["o","ubuntu.com: 203.0.113.50","ok"],["c","niall@ubuntu:~$ ","resolvectl flush-caches"],["o","(no output means it worked)"],["c","niall@ubuntu:~$ ",""]];
 var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
 var run=0;
 function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
 function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
 function full(el,seq){var h='';seq.forEach(function(l){h+=l[0]=='c'?'<span class="p">'+esc(l[1])+'</span>'+esc(l[2])+'\n':(l[2]?'<span class="'+l[2]+'">'+esc(l[1])+'</span>':esc(l[1]))+'\n'});el.innerHTML=h.replace(/\n$/,'')+'<span class="cur"></span>'}
 async function play(el,seq,id,startDelay){
  var h='';el.innerHTML='<span class="cur"></span>';await sleep(startDelay);
  for(var i=0;i<seq.length;i++){
   if(id!==run)return;var l=seq[i];
   if(l[0]=='c'){h+='<span class="p">'+esc(l[1])+'</span>';
    for(var j=0;j<l[2].length;j++){if(id!==run)return;h+=esc(l[2][j]);el.innerHTML=h+'<span class="cur"></span>';await sleep(70+Math.random()*60)}
    if(i<seq.length-1){h+='\n';el.innerHTML=h+'<span class="cur"></span>';await sleep(450)}}
   else{h+=(l[2]?'<span class="'+l[2]+'">'+esc(l[1])+'</span>':esc(l[1]))+'\n';el.innerHTML=h+'<span class="cur"></span>';await sleep(l[1]?260:120)}
  }
 }
 function start(){run++;var id=run;play(document.getElementById('t-ps'),PS,id,300);play(document.getElementById('t-ub'),UB,id,900)}
 var a=document.getElementById('t-ps'),b=document.getElementById('t-ub');
 if(reduce){full(a,PS);full(b,UB)}else{
  full(a,[PS[0]]);full(b,[UB[0]]);
  if('IntersectionObserver' in window){var seen=false,io=new IntersectionObserver(function(en){if(en[0].isIntersecting&&!seen){seen=true;start();io.disconnect()}},{threshold:.35});io.observe(document.getElementById('termwrap'))}else start();
 }
 document.getElementById('t-replay').addEventListener('click',function(){if(reduce){full(a,PS);full(b,UB)}else start()});
})();
</script>
