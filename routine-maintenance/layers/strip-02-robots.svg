<symbol id="host" viewBox="240 20 560 620" overflow="hidden"><use href="#m-chair" xlink:href="#m-chair"/><use href="#m-robot" xlink:href="#m-robot"/><use href="#m-smoke" xlink:href="#m-smoke"/></symbol></defs>
