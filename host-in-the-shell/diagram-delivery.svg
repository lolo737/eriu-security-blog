<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="Citrix, AVD and Horizon deliver desktops and apps from VMs on a hypervisor to the user's device"><rect width="900" height="460" rx="18" fill="#04161b" stroke="rgba(0,219,204,.35)" stroke-width="2"/><text x="450" y="46" text-anchor="middle" fill="#ffb81a" font-size="22" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">WHO RUNS IT, AND WHO DELIVERS IT</text><rect x="30" y="100" width="200" height="150" rx="14" fill="#0c2a31" stroke="#00dbcc" stroke-width="2"/><text x="130" y="150" text-anchor="middle" fill="#00dbcc" font-size="15" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">USER'S DEVICE</text><text x="130" y="180" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">laptop · thin client</text><text x="130" y="204" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">phone · home PC</text><rect x="350" y="100" width="200" height="150" rx="14" fill="#b8a9e8" stroke="none" stroke-width="2"/><text x="450.0" y="160.54999999999998" text-anchor="middle" fill="#02141a" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">DELIVERY LAYER</text><text x="450.0" y="180.95" text-anchor="middle" fill="#02141a" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">Citrix · AVD</text><text x="450.0" y="201.34999999999997" text-anchor="middle" fill="#02141a" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">Horizon</text><rect x="670" y="100" width="200" height="150" rx="14" fill="#0c2a31" stroke="#f54447" stroke-width="2"/><text x="770" y="128" text-anchor="middle" fill="#f54447" font-size="15" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">HYPERVISOR</text><rect x="690" y="142" width="70" height="92" rx="14" fill="#40ea99" stroke="none" stroke-width="2"/><text x="725.0" y="193.25" text-anchor="middle" fill="#02141a" font-size="15" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">VM</text><rect x="780" y="142" width="70" height="92" rx="14" fill="#40ea99" stroke="none" stroke-width="2"/><text x="815.0" y="193.25" text-anchor="middle" fill="#02141a" font-size="15" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">VM</text><line x1="232" y1="175" x2="348" y2="175" stroke="#00dbcc" stroke-width="3" stroke-dasharray="8 6"/><polygon points="348,175 336,167 336,183" fill="#00dbcc"/><text x="290.0" y="161" text-anchor="middle" fill="#d7e7ea" font-size="14" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">screen + keys</text><line x1="552" y1="175" x2="668" y2="175" stroke="#00dbcc" stroke-width="3" stroke-dasharray="8 6"/><polygon points="668,175 656,167 656,183" fill="#00dbcc"/><text x="610.0" y="161" text-anchor="middle" fill="#d7e7ea" font-size="14" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">connects to</text><text x="450" y="290" text-anchor="middle" fill="#d7e7ea" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">The user gets the screen, not the machine. The files stay on the server.</text><rect x="30" y="320" width="270" height="110" rx="14" fill="#0c2a31" stroke="#ffb81a" stroke-width="2"/><text x="165" y="356" text-anchor="middle" fill="#ffb81a" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">PUBLISHED APP</text><text x="165" y="386" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">Just one program</text><text x="165" y="408" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">streamed to you</text><rect x="320" y="320" width="270" height="110" rx="14" fill="#0c2a31" stroke="#40ea99" stroke-width="2"/><text x="455" y="356" text-anchor="middle" fill="#40ea99" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">VDI</text><text x="455" y="386" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">Own VM desktop</text><text x="455" y="408" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">for each user</text><rect x="610" y="320" width="270" height="110" rx="14" fill="#0c2a31" stroke="#00dbcc" stroke-width="2"/><text x="745" y="356" text-anchor="middle" fill="#00dbcc" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif">RDS / SESSION HOST</text><text x="745" y="386" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">Everyone shares</text><text x="745" y="408" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="400" font-family="Inter,Helvetica,Arial,sans-serif">one server OS</text></svg>