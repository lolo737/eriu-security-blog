<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Quick guide to telling Type 1, Type 2, containers and delivery layers apart"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0638"/><stop offset=".6" stop-color="#3a0a62"/><stop offset="1" stop-color="#7a1470"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffb04a"/><stop offset="1" stop-color="#ff2d8f"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<mask id="sm"><rect width="200" height="200" fill="#fff"/><g fill="#000"><rect y="112" width="200" height="4"/><rect y="132" width="200" height="6"/><rect y="154" width="200" height="8"/><rect y="178" width="200" height="12"/></g></mask>
</defs><rect width="900" height="500" rx="22" fill="url(#bg)"/><g opacity=".16" transform="translate(350.0,150.0)"><circle cx="100" cy="100" r="96" fill="url(#sun)" mask="url(#sm)"/></g><line x1="0" y1="441.6" x2="900" y2="441.6" stroke="#ff3d9a" stroke-opacity=".18"/><line x1="0" y1="446.4" x2="900" y2="446.4" stroke="#ff3d9a" stroke-opacity=".18"/><line x1="0" y1="454.4" x2="900" y2="454.4" stroke="#ff3d9a" stroke-opacity=".18"/><line x1="0" y1="465.6" x2="900" y2="465.6" stroke="#ff3d9a" stroke-opacity=".18"/><line x1="0" y1="480.0" x2="900" y2="480.0" stroke="#ff3d9a" stroke-opacity=".18"/><line x1="0" y1="497.6" x2="900" y2="497.6" stroke="#ff3d9a" stroke-opacity=".18"/><line x1="0" y1="518.4" x2="900" y2="518.4" stroke="#ff3d9a" stroke-opacity=".18"/><text x="450" y="44" text-anchor="middle" fill="#ffe27a" font-size="30" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="3">CHEAT CODE: WHICH KIND IS IT?</text><text x="450" y="70" text-anchor="middle" fill="#fdf3ff" font-size="15" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">ask the question on the left, get the answer on the right</text><rect x="30" y="96" width="420" height="76" rx="14" fill="#240a45" stroke="#ff3d9a" stroke-width="2.5" filter="url(#glow)"/><text x="240" y="142" text-anchor="middle" fill="#fdf3ff" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">It runs straight on the server hardware</text><polygon points="488,134 468,122 468,146" fill="#ff3d9a" filter="url(#glow)"/><rect x="496" y="96" width="374" height="76" rx="14" fill="#ff3d9a" filter="url(#glow)"/><text x="683.0" y="140.3" text-anchor="middle" fill="#12001f" font-size="18" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0"></text><text x="683" y="130" text-anchor="middle" fill="#12001f" font-size="23" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">TYPE 1 HYPERVISOR</text><text x="683" y="154" text-anchor="middle" fill="#12001f" font-size="14" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">ESXi · Hyper-V · Proxmox</text><rect x="30" y="188" width="420" height="76" rx="14" fill="#240a45" stroke="#ffa63d" stroke-width="2.5" filter="url(#glow)"/><text x="240" y="234" text-anchor="middle" fill="#fdf3ff" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">It's an app I open on my laptop</text><polygon points="488,226 468,214 468,238" fill="#ffa63d" filter="url(#glow)"/><rect x="496" y="188" width="374" height="76" rx="14" fill="#ffa63d" filter="url(#glow)"/><text x="683.0" y="232.3" text-anchor="middle" fill="#12001f" font-size="18" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0"></text><text x="683" y="222" text-anchor="middle" fill="#12001f" font-size="23" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">TYPE 2 HYPERVISOR</text><text x="683" y="246" text-anchor="middle" fill="#12001f" font-size="14" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">VirtualBox · Workstation</text><rect x="30" y="280" width="420" height="76" rx="14" fill="#240a45" stroke="#8cff7a" stroke-width="2.5" filter="url(#glow)"/><text x="240" y="326" text-anchor="middle" fill="#fdf3ff" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">It shares the host's kernel and starts in seconds</text><polygon points="488,318 468,306 468,330" fill="#8cff7a" filter="url(#glow)"/><rect x="496" y="280" width="374" height="76" rx="14" fill="#8cff7a" filter="url(#glow)"/><text x="683.0" y="324.3" text-anchor="middle" fill="#12001f" font-size="18" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0"></text><text x="683" y="314" text-anchor="middle" fill="#12001f" font-size="23" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">CONTAINER</text><text x="683" y="338" text-anchor="middle" fill="#12001f" font-size="14" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Docker · Kubernetes</text><rect x="30" y="372" width="420" height="76" rx="14" fill="#240a45" stroke="#22e6d6" stroke-width="2.5" filter="url(#glow)"/><text x="240" y="418" text-anchor="middle" fill="#fdf3ff" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">I just get a window onto something on a server</text><polygon points="488,410 468,398 468,422" fill="#22e6d6" filter="url(#glow)"/><rect x="496" y="372" width="374" height="76" rx="14" fill="#22e6d6" filter="url(#glow)"/><text x="683.0" y="416.3" text-anchor="middle" fill="#12001f" font-size="18" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0"></text><text x="683" y="406" text-anchor="middle" fill="#12001f" font-size="23" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">DELIVERY LAYER</text><text x="683" y="430" text-anchor="middle" fill="#12001f" font-size="14" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Citrix · AVD · Horizon</text><text x="450" y="478" text-anchor="middle" fill="#ffe27a" font-size="15" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Hypervisors and containers split a machine. Citrix and AVD only deliver the screen.</text><rect x="1.5" y="1.5" width="897" height="497" rx="21" fill="none" stroke="#ff3d9a" stroke-opacity=".5" stroke-width="2"/></svg>