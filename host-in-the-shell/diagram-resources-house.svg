<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" role="img" aria-label="How to give a virtual machine more RAM, CPU or disk by editing its settings on the hypervisor"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0638"/><stop offset=".6" stop-color="#3a0a62"/><stop offset="1" stop-color="#7a1470"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffb04a"/><stop offset="1" stop-color="#ff2d8f"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<mask id="sm"><rect width="200" height="200" fill="#fff"/><g fill="#000"><rect y="112" width="200" height="4"/><rect y="132" width="200" height="6"/><rect y="154" width="200" height="8"/><rect y="178" width="200" height="12"/></g></mask>
</defs><rect width="900" height="572" rx="22" fill="#04161b"/><text x="450" y="44" text-anchor="middle" fill="#ffb81a" font-size="30" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="3">LEVEL UP: GIVE A VM MORE</text><text x="450" y="70" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">the VM can't ask the server itself. You change it at the hypervisor.</text><rect x="30" y="96" width="250" height="150" rx="14" fill="#0c2a31" stroke="#40ea99" stroke-width="2.5" filter="url(#glow)"/><text x="155" y="124" text-anchor="middle" fill="#40ea99" font-size="18" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">THE VM</text><text x="155" y="156" text-anchor="middle" fill="#d7e7ea" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">4 GB RAM</text><text x="155" y="180" text-anchor="middle" fill="#d7e7ea" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">2 CPUs</text><text x="155" y="204" text-anchor="middle" fill="#d7e7ea" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">80 GB disk</text><text x="155" y="232" text-anchor="middle" fill="#f54447" font-size="13" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">runs out of room</text><rect x="325" y="96" width="250" height="150" rx="14" fill="#0c2a31" stroke="#f54447" stroke-width="2.5" filter="url(#glow)"/><text x="450" y="124" text-anchor="middle" fill="#f54447" font-size="18" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">THE HYPERVISOR</text><text x="450" y="154" text-anchor="middle" fill="#d7e7ea" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Edit settings</text><text x="450" y="178" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">set RAM, CPU, disk</text><text x="450" y="206" text-anchor="middle" fill="#ffb81a" font-size="13" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">vSphere · Hyper-V Manager</text><text x="450" y="226" text-anchor="middle" fill="#ffb81a" font-size="13" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Proxmox · VirtualBox</text><rect x="620" y="96" width="250" height="150" rx="14" fill="#0c2a31" stroke="#00dbcc" stroke-width="2.5" filter="url(#glow)"/><text x="745" y="124" text-anchor="middle" fill="#00dbcc" font-size="18" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">THE SERVER (HOST)</text><text x="745" y="156" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">a pool of real</text><text x="745" y="178" text-anchor="middle" fill="#d7e7ea" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">CPU · RAM · disk</text><text x="745" y="206" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">hands a bigger slice</text><text x="745" y="228" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">to the VM</text><line x1="282" y1="171" x2="323" y2="171" stroke="#00dbcc" stroke-width="3" stroke-dasharray="8 6"/><polygon points="323,171 311,163 311,179" fill="#00dbcc"/><text x="302.5" y="159" text-anchor="middle" fill="#d7e7ea" font-size="12" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">you ask</text><line x1="577" y1="171" x2="618" y2="171" stroke="#40ea99" stroke-width="3" stroke-dasharray="8 6"/><polygon points="618,171 606,163 606,179" fill="#40ea99"/><text x="597.5" y="159" text-anchor="middle" fill="#d7e7ea" font-size="12" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">it gives</text><rect x="30" y="270" width="840" height="38" rx="10" fill="#04161b" stroke="#ffb81a" stroke-width="2" filter="url(#glow)"/><circle cx="62" cy="289" r="14" fill="#ffb81a"/><text x="62" y="295" text-anchor="middle" fill="#04161b" font-size="16" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">1</text><text x="92" y="295" text-anchor="start" fill="#ffb81a" font-size="17" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">SNAPSHOT</text><text x="300" y="295" text-anchor="start" fill="#d7e7ea" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">a save point, in case it goes wrong</text><rect x="30" y="316" width="840" height="38" rx="10" fill="#04161b" stroke="#ffb81a" stroke-width="2" filter="url(#glow)"/><circle cx="62" cy="335" r="14" fill="#ffb81a"/><text x="62" y="341" text-anchor="middle" fill="#04161b" font-size="16" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">2</text><text x="92" y="341" text-anchor="start" fill="#ffb81a" font-size="17" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">POWER OFF</text><text x="300" y="341" text-anchor="start" fill="#d7e7ea" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">unless hot-add is switched on</text><rect x="30" y="362" width="840" height="38" rx="10" fill="#04161b" stroke="#ffb81a" stroke-width="2" filter="url(#glow)"/><circle cx="62" cy="381" r="14" fill="#ffb81a"/><text x="62" y="387" text-anchor="middle" fill="#04161b" font-size="16" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">3</text><text x="92" y="387" text-anchor="start" fill="#ffb81a" font-size="17" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">EDIT SETTINGS</text><text x="300" y="387" text-anchor="start" fill="#d7e7ea" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">raise the RAM, CPUs or disk</text><rect x="30" y="408" width="840" height="38" rx="10" fill="#04161b" stroke="#ffb81a" stroke-width="2" filter="url(#glow)"/><circle cx="62" cy="427" r="14" fill="#ffb81a"/><text x="62" y="433" text-anchor="middle" fill="#04161b" font-size="16" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">4</text><text x="92" y="433" text-anchor="start" fill="#ffb81a" font-size="17" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">POWER ON</text><text x="300" y="433" text-anchor="start" fill="#d7e7ea" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">check it boots and sees the new RAM</text><rect x="30" y="454" width="840" height="38" rx="10" fill="#04161b" stroke="#ffb81a" stroke-width="2" filter="url(#glow)"/><circle cx="62" cy="473" r="14" fill="#ffb81a"/><text x="62" y="479" text-anchor="middle" fill="#04161b" font-size="16" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="0">5</text><text x="92" y="479" text-anchor="start" fill="#ffb81a" font-size="17" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">DISK ONLY</text><text x="300" y="479" text-anchor="start" fill="#d7e7ea" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">extend the partition inside the OS</text><text x="450" y="520" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">On a managed system you raise a ticket. The virtualisation team does steps 1 to 4.</text><text x="450" y="545" text-anchor="middle" fill="#ffb81a" font-size="14" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Containers are different: set the limit when you start them (docker run --memory 512m).</text><rect x="1.5" y="1.5" width="897" height="569" rx="21" fill="none" stroke="#00dbcc" stroke-opacity=".5" stroke-width="2"/></svg>