370" height="50" rx="14" fill="#ff3d9a" filter="url(#glow)"/><text x="675.0" y="345.3" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">HYPERVISOR  ·  just an app</text><rect x="490" y="148" width="180" height="156" rx="14" fill="#0d2a28" stroke="#8cff7a" stroke-width="2.5" filter="url(#glow)"/><text x="580.0" y="166" text-anchor="middle" fill="#8cff7a" font-size="13" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">VM</text><rect x="498" y="174" width="164" height="49.559999999999995" rx="8" fill="#ffa63d" filter="url(#glow)"/><text x="580.0" y="203.33" text-anchor="middle" fill="#12001f" font-size="13" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><rect x="498" y="228.56" width="164" height="63.44" rx="8" fill="#b8a9e8" filter="url(#glow)"/><text x="580.0" y="264.47999999999996" text-anchor="middle" fill="#12001f" font-size="12" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Guest OS</text><rect x="680" y="148" width="180" height="156" rx="14" fill="#0d2a28" stroke="#8cff7a" stroke-width="2.5" filter="url(#glow)"/><text x="770.0" y="166" text-anchor="middle" fill="#8cff7a" font-size="13" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">VM</text><rect x="688" y="174" width="164" height="49.559999999999995" rx="8" fill="#ffa63d" filter="url(#glow)"/><text x="770.0" y="203.33" text-anchor="middle" fill="#12001f" font-size="13" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><rect x="688" y="228.56" width="164" height="63.44" rx="8" fill="#b8a9e8" filter="url(#glow)"/><text x="770.0" y="264.47999999999996" text-anchor="middle" fill="#12001f" font-size="12" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Guest OS</text><text x="675" y="512" text-anchor="middle" fill="#ffa63d" font-size="17" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">VirtualBox · VMware Workstation · Parallels</text><text x="675" y="535" text-anchor="middle" fill="#fdf3ff" font-size="14" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Meet it in: your laptop, a lab, a test rig</text><rect x="40" y="552" width="820" height="62" rx="14" fill="#12001f" stroke="#ffe27a" stroke-width="2.5" filter="url(#glow)"/><text x="450" y="578" text-anchor="middle" fill="#ffe27a" font-size="16" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">THE TEST: count the layers between the hardware and the VM</text><text x="450" y="602" text-anchor="middle" fill="#fdf3ff" font-size="15" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Type 1 = hypervisor only.   Type 2 = host OS, then hypervisor.</text><rect x="1.5" y="1.5" width="897" height="629" rx="21" fill="none" stroke="#ff3d9a" stroke-opacity=".5" stroke-width="2"/></svg>