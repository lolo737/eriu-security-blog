ht="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">HYPERVISOR  ·  is the OS</text><rect x="40" y="220" width="120" height="142" rx="14" fill="#0d2a28" stroke="#8cff7a" stroke-width="2.5" filter="url(#glow)"/><text x="100.0" y="238" text-anchor="middle" fill="#8cff7a" font-size="13" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">VM</text><rect x="48" y="246" width="104" height="43.68" rx="8" fill="#ffa63d" filter="url(#glow)"/><text x="100.0" y="272.39" text-anchor="middle" fill="#12001f" font-size="13" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><rect x="48" y="294.68" width="104" height="55.31999999999999" rx="8" fill="#b8a9e8" filter="url(#glow)"/><text x="100.0" y="326.54" text-anchor="middle" fill="#12001f" font-size="12" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Guest OS</text><rect x="165" y="220" width="120" height="142" rx="14" fill="#0d2a28" stroke="#8cff7a" stroke-width="2.5" filter="url(#glow)"/><text x="225.0" y="238" text-anchor="middle" fill="#8cff7a" font-size="13" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">VM</text><rect x="173" y="246" width="104" height="43.68" rx="8" fill="#ffa63d" filter="url(#glow)"/><text x="225.0" y="272.39" text-anchor="middle" fill="#12001f" font-size="13" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><rect x="173" y="294.68" width="104" height="55.31999999999999" rx="8" fill="#b8a9e8" filter="url(#glow)"/><text x="225.0" y="326.54" text-anchor="middle" fill="#12001f" font-size="12" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Guest OS</text><rect x="290" y="220" width="120" height="142" rx="14" fill="#0d2a28" stroke="#8cff7a" stroke-width="2.5" filter="url(#glow)"/><text x="350.0" y="238" text-anchor="middle" fill="#8cff7a" font-size=