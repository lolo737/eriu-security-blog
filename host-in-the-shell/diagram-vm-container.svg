-anchor="middle" fill="#fdf3ff" font-size="15" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Strong</text><text x="675" y="587" text-anchor="middle" fill="#fdf3ff" font-size="15" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Lighter</text><rect x="1.5" y="1.5" width="897" height="609" rx="21" fill="none" stroke="#ff3d9a" stroke-opacity=".5" stroke-width="2"/></svg>