etica,Arial,sans-serif" letter-spacing="0">HYPERVISOR</text><rect x="40" y="258" width="120" height="48" rx="10" fill="#b8a9e8" filter="url(#glow)"/><text x="100.0" y="286.9" text-anchor="middle" fill="#12001f" font-size="14" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Guest OS</text><rect x="40" y="202" width="120" height="48" rx="10" fill="#ffa63d" filter="url(#glow)"/><text x="100.0" y="231.25" text-anchor="middle" fill="#12001f" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><rect x="165" y="258" width="120" height="48" rx="10" fill="#b8a9e8" filter="url(#glow)"/><text x="225.0" y="286.9" text-anchor="middle" fill="#12001f" font-size="14" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Guest OS</text><rect x="165" y="202" width="120" height="48" rx="10" fill="#ffa63d" filter="url(#glow)"/><text x="225.0" y="231.25" text-anchor="middle" fill="#12001f" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><rect x="290" y="258" width="120" height="48" rx="10" fill="#b8a9e8" filter="url(#glow)"/><text x="350.0" y="286.9" text-anchor="middle" fill="#12001f" font-size="14" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Guest OS</text><rect x="290" y="202" width="120" height="48" rx="10" fill="#ffa63d" filter="url(#glow)"/><text x="350.0" y="231.25" text-anchor="middle" fill="#12001f" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><text x="225" y="456" text-anchor="middle" fill="#ff3d9a" font-size="19" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1">A whole computer in a box</text><text x="225" y="480" text-anchor="middle" fill="#fdf3ff" font-size="14" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Own operating system each</text><rect x="525.0" y="92" width="300" height="38" rx="19" fill="#12001f" stroke="#ffa63d" stroke-width="2.5" filter="url(#glow)"/><text x="675" y="119" text-anchor="middle" fill="#ffa63d" font-size="22" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">CONTAINER</text><rect x="490" y="372" width="370" height="50" rx="14" fill="#240a45" stroke="#22e6d6" stroke-width="2.5" filter="url(#glow)"/><text x="675.0" y="402.95" text-anchor="middle" fill="#fdf3ff" font-size="17" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">HARDWARE</text><rect x="490" y="314" width="370" height="50" rx="14" fill="#b8a9e8" filter="url(#glow)"/><text x="675.0" y="344.6" text-anchor="middle" fill="#12001f" font-size="16" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">HOST OS · ONE SHARED KERNEL</text><rect x="490" y="258" width="370" height="48" rx="14" fill="#ff3d9a" filter="url(#glow)"/><text x="675.0" y="287.6" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">CONTAINER ENGINE  (Docker)</text><rect x="490" y="202" width="120" height="48" rx="10" fill="#ffa63d" filter="url(#glow)"/><text x="550.0" y="231.25" text-anchor="middle" fill="#12001f" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><rect x="615" y="202" width="120" height="48" rx="10" fill="#ffa63d" filter="url(#glow)"/><text x="675.0" y="231.25" text-anchor="middle" fill="#12001f" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><rect x="740" y="202" width="120" height="48" rx="10" fill="#ffa63d" filter="url(#glow)"/><text x="800.0" y="231.25" text-anchor="middle" fill="#12001f" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">App</text><text x="67