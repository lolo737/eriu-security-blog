<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 544" role="img" aria-label="Citrix, AVD and Horizon deliver desktops and apps from VMs on a hypervisor to the user's device"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b0638"/><stop offset=".6" stop-color="#3a0a62"/><stop offset="1" stop-color="#7a1470"/></linearGradient>
<linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffb04a"/><stop offset="1" stop-color="#ff2d8f"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="0" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<mask id="sm"><rect width="200" height="200" fill="#fff"/><g fill="#000"><rect y="112" width="200" height="4"/><rect y="132" width="200" height="6"/><rect y="154" width="200" height="8"/><rect y="178" width="200" height="12"/></g></mask>
</defs><rect width="900" height="544" rx="22" fill="#04161b"/><text x="450" y="44" text-anchor="middle" fill="#ffb81a" font-size="30" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="3">KIND 4: THE DELIVERY LAYER</text><text x="450" y="70" text-anchor="middle" fill="#d7e7ea" font-size="15" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Citrix, AVD, Horizon: how the screen reaches you</text><rect x="30" y="104" width="230" height="170" rx="14" fill="#0c2a31" stroke="#00dbcc" stroke-width="2.5" filter="url(#glow)"/><text x="145" y="134" text-anchor="middle" fill="#00dbcc" font-size="17" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">YOUR COMPUTER</text><rect x="52" y="146" width="186" height="98" rx="8" fill="#04161b" stroke="#ffb81a" stroke-width="2" filter="url(#glow)"/><text x="145" y="184" text-anchor="middle" fill="#ffb81a" font-size="16" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">a window</text><text x="145" y="206" text-anchor="middle" fill="#d7e7ea" font-size="14" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">showing the app</text><text x="145" y="228" text-anchor="middle" fill="#d7e7ea" font-size="14" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">that lives elsewhere</text><text x="145" y="262" text-anchor="middle" fill="#d7e7ea" font-size="12" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">laptop · thin client · home PC</text><rect x="335" y="104" width="230" height="170" rx="14" fill="#0c2a31" stroke="#f54447" stroke-width="2.5" filter="url(#glow)"/><text x="450" y="134" text-anchor="middle" fill="#f54447" font-size="17" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">DELIVERY LAYER</text><rect x="355" y="148" width="190" height="34" rx="14" fill="#f54447" filter="url(#glow)"/><text x="450.0" y="170.6" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">CITRIX</text><rect x="355" y="188" width="190" height="34" rx="14" fill="#f54447" filter="url(#glow)"/><text x="450.0" y="210.6" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">AVD</text><rect x="355" y="228" width="190" height="34" rx="14" fill="#f54447" filter="url(#glow)"/><text x="450.0" y="250.6" text-anchor="middle" fill="#fff" font-size="16" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">HORIZON</text><rect x="640" y="104" width="230" height="170" rx="14" fill="#0c2a31" stroke="#40ea99" stroke-width="2.5" filter="url(#glow)"/><text x="755" y="134" text-anchor="middle" fill="#40ea99" font-size="17" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">THE SERVER</text><rect x="660" y="146" width="190" height="34" rx="8" fill="#b8a9e8" filter="url(#glow)"/><text x="755.0" y="168.25" text-anchor="middle" fill="#04161b" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">hypervisor</text><rect x="660" y="188" width="88" height="56" rx="8" fill="#40ea99" filter="url(#glow)"/><text x="704.0" y="221.25" text-anchor="middle" fill="#04161b" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">VM</text><rect x="762" y="188" width="88" height="56" rx="8" fill="#40ea99" filter="url(#glow)"/><text x="806.0" y="221.25" text-anchor="middle" fill="#04161b" font-size="15" font-weight="800" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">VM</text><text x="755" y="262" text-anchor="middle" fill="#d7e7ea" font-size="12" font-weight="500" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">the app runs here</text><line x1="262" y1="190" x2="333" y2="190" stroke="#00dbcc" stroke-width="3" stroke-dasharray="8 6"/><polygon points="333,190 321,182 321,198" fill="#00dbcc"/><text x="297.5" y="178" text-anchor="middle" fill="#d7e7ea" font-size="12" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">screen</text><line x1="567" y1="190" x2="638" y2="190" stroke="#00dbcc" stroke-width="3" stroke-dasharray="8 6"/><polygon points="638,190 626,182 626,198" fill="#00dbcc"/><text x="602.5" y="178" text-anchor="middle" fill="#d7e7ea" font-size="12" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">connects</text><g transform="rotate(-3 450 318)"><rect x="170" y="296" width="560" height="44" rx="10" fill="#f54447" filter="url(#glow)"/><text x="450" y="326" text-anchor="middle" fill="#d7e7ea" font-size="22" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="2">BUSTED: CITRIX IS NOT A HYPERVISOR</text></g><text x="450" y="370" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">You get the screen, not the machine. The files stay on the server. Simple as.</text><rect x="30" y="392" width="270" height="128" rx="14" fill="#0c2a31" stroke="#ffb81a" stroke-width="2.5" filter="url(#glow)"/><text x="165" y="422" text-anchor="middle" fill="#ffb81a" font-size="19" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">PUBLISHED APP</text><text x="165" y="452" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">one program,</text><text x="165" y="474" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">streamed to your window</text><text x="165" y="504" text-anchor="middle" fill="#ffb81a" font-size="13" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">The usual Citrix setup</text><rect x="320" y="392" width="270" height="128" rx="14" fill="#0c2a31" stroke="#40ea99" stroke-width="2.5" filter="url(#glow)"/><text x="455" y="422" text-anchor="middle" fill="#40ea99" font-size="19" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">VDI</text><text x="455" y="452" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">your own VM desktop</text><text x="455" y="474" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">one VM per person</text><text x="455" y="504" text-anchor="middle" fill="#40ea99" font-size="13" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">Personal desktop, remote</text><rect x="610" y="392" width="270" height="128" rx="14" fill="#0c2a31" stroke="#00dbcc" stroke-width="2.5" filter="url(#glow)"/><text x="745" y="422" text-anchor="middle" fill="#00dbcc" font-size="19" font-weight="800" font-family="Oswald,'Arial Narrow',Impact,sans-serif" letter-spacing="1.5">RDS / SESSION HOST</text><text x="745" y="452" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">everyone shares</text><text x="745" y="474" text-anchor="middle" fill="#d7e7ea" font-size="16" font-weight="700" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">one server OS</text><text x="745" y="504" text-anchor="middle" fill="#00dbcc" font-size="13" font-weight="600" font-family="Inter,Helvetica,Arial,sans-serif" letter-spacing="0">A busy shared server</text><rect x="1.5" y="1.5" width="897" height="541" rx="21" fill="none" stroke="#00dbcc" stroke-opacity=".5" stroke-width="2"/></svg>